[aliases]
jjbch = "jj bookmark create -r HEAD"
jjbsmr = "jj bookmark set -r 'remote_bookmarks() & main_branch()' main"
jjbth = "jj closestbookmark | xargs jj bookmark track"
jjrbm = "jj rebase -o 'main_branch()'"
"jjrbm@" = "jj rebase -o main -r @"
jjsm = "jj git fetch && jj new -r 'main_branch()'"
jjundo = "jj undo"
na = "nub add"
nad = "nub add -D"
nb = "nub run build"
nd = "nub run dev"
nex = "nub exec"
nfmt = "nub run format"
ni = "nub install"
nln = "nub run lint"
nr = "nub run"
nt = "nub run test"
nui = "nub up -i"
nuir = "nub up -ir"
pfdn = "pitchfork stop"
pfl = "pitchfork logs"
pflf = "pitchfork logs -f"
pfls = "pitchfork ls"
pfrs = "pitchfork restart"
pfsrs = "pitchfork sup start --force"
pfup = "pitchfork start"
pfupl = "pitchfork start --local"
ytdlb = "ytdl -f 'bestvideo+bestaudio/bestvideo+bestaudio' --merge-output-format=mkv"

